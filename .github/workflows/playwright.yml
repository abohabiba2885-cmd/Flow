name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Static validation
      run: |
        npm run test:typecheck
        npm run validate
        npm run validate:links
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        BASE_URL: ${{ vars.BASE_URL }}
        FLOWSKY_EMAIL: ${{ secrets.FLOWSKY_EMAIL }}
        FLOWSKY_PASSWORD: ${{ secrets.FLOWSKY_PASSWORD }}
        FLOWSKY_RESTRICTED_EMAIL: ${{ secrets.FLOWSKY_RESTRICTED_EMAIL }}
        FLOWSKY_RESTRICTED_PASSWORD: ${{ secrets.FLOWSKY_RESTRICTED_PASSWORD }}
        EDIT_PRODUCT_ID: ${{ vars.EDIT_PRODUCT_ID }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: |
          reports/
          test-results/
        retention-days: 30
